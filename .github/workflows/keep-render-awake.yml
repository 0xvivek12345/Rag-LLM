# Render's free web service sleeps after ~15 minutes idle, then the next
# visitor waits for a cold start. Ping the Streamlit health URL often enough
# to keep the instance up. Disable this workflow if you move to a paid plan.
name: keep-render-awake

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Streamlit health endpoint
        run: |
          url="${{ vars.RENDER_HEALTH_URL }}"
          if [ -z "$url" ]; then
            url="https://rag-llm-28lt.onrender.com/_stcore/health"
          fi
          curl -fsS --retry 4 --retry-delay 15 --max-time 60 "$url"
